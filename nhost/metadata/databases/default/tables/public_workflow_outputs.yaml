table:
  name: workflow_outputs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_id
        - data
        - created_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
