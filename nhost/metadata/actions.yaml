actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/triggerWorkflowRun"
      forward_client_headers: true
      headers:
        - name: Authorization
          value_from_env: NHOST_WEBHOOK_SECRET
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/approveStep"
      forward_client_headers: true
      headers:
        - name: Authorization
          value_from_env: NHOST_WEBHOOK_SECRET
  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: "{{NHOST_BACKEND_URL}}/v1/functions/webhookTrigger"
      forward_client_headers: true
custom_types:
  enums: []
  input_objects:
    - name: TriggerInput
    - name: ApproveInput
    - name: WebhookTriggerInput
  objects:
    - name: TriggerResponse
    - name: ApproveResponse
    - name: WebhookTriggerResponse
  scalars: []
