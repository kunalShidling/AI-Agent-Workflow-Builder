actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/triggerWorkflowRun"
      forward_client_headers: true
      headers:
        - name: Authorization
          value_from_env: NHOST_WEBHOOK_SECRET
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approveStep"
      forward_client_headers: true
      headers:
        - name: Authorization
          value_from_env: NHOST_WEBHOOK_SECRET
  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/webhookTrigger"
      forward_client_headers: true
custom_types:
  enums: []
  input_objects:
    - name: TriggerInput
    - name: ApproveInput
    - name: WebhookTriggerInput
  objects:
    - name: TriggerResponse
    - name: ApproveResponse
    - name: WebhookTriggerResponse
  scalars: []
